<h1 class="badge-info text-center p-2">Todo</h1>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <h1>
                {{isInEditMode ? "Update Todo" : "Add Todo"}}
            </h1>
            <div class="card">
                <div class="card-body">
                    <div class="form-group">
                        <label for="todoItem">Enter your Todo</label>
                        <input type="text" class="form-control" #todoItemRef>
                    </div>
                    <div class="form-group">
                        <label for="isCompleted">Is Completed</label>
                        <select class="form-control" #isCompletedRef>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <button *ngIf="!isInEditMode" mat-raised-button color="primary" class="w-100" (click)="onTodoAdd()">Add Todo</button>
                    <button *ngIf="isInEditMode" mat-raised-button color="primary" class="w-100" (click)="onTodoUpdate()">Update Todo</button>
                </div>
            </div>
        </div>
        <div class="col-md-8 mb-4">
            <div class="card">
                <div class="card-body">
                    <ul class="list-group" *ngIf="todosArr.length > 0 ; else noTodo">
                        <li *ngFor="let todo of todosArr" class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong>
                                    <input 
                                    (click)="onChangeCheck(todo)"
                                    [checked] = "todo.isCompleted"
                                    type="checkbox" >
                                    {{todo.todoItem}}
                                    <small class="badge" [ngClass]="{
                                        'badge-danger':!todo.isCompleted,
                                        'badge-success':todo.isCompleted
                                    }">
                                        {{todo.isCompleted ? "Completed" : "In Completed"}}
                                    </small>
                                </strong>
                            </div>
                            <div>
                                <button mat-mini-fab color="primary" class="mr-2" (click)="onTodoEdit(todo)"><mat-icon>edit</mat-icon></button>
                                <button mat-mini-fab color="warn" (click)="onTodoRemove(todo.todoId)"><mat-icon>delete</mat-icon></button>
                            </div>
                        </li>
                    </ul>
                    <ng-template #noTodo>
                        <p class="alert alert-warning">
                            No Todo is added yet.
                        </p>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>
